server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Matches this app's own vite.config.ts dev-server proxy, so the SPA can
  # keep calling relative "/v1" and "/uploads" paths in every environment.
  # The api service is only reachable by its compose service name from
  # inside this container's network, so this must stay server-side.
  location /v1/ {
    proxy_pass http://api:4000/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://api:4000/uploads/;
    proxy_set_header Host $host;
  }

  # react-router-dom v7 client-side routing: any unmatched path falls back
  # to index.html so the SPA's router can handle it.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
}
